<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serbian AI Tutor - Beta Launch Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 80px;
            position: relative;
            overflow: hidden;
        }
        
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: #0066FF;
        }
        
        .content-wrapper {
            text-align: center;
            z-index: 2;
        }
        
        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 72px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #0066FF;
            margin-bottom: 48px;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 48px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .metric-box {
            background: #FFFFFF;
            border: 2px solid #0066FF;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
        }
        
        .metric-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #0066FF;
            margin-bottom: 8px;
        }
        
        .metric-label {
            font-size: 14px;
            color: #4a4a4a;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
            color: #4a4a4a;
        }
        
        .footer-left, .footer-right {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .footer-label {
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .decorative-shape {
            position: absolute;
            bottom: -50px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: #0066FF;
            opacity: 0.05;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-bar"></div>
        
        <div class="content-wrapper">
            <h1 class="title">Serbian AI Tutor</h1>
            <h2 class="subtitle">Beta Launch Audit Report</h2>
            
            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-value">50-60%</div>
                    <div class="metric-label">Ready</div>
                </div>
                <div class="metric-box">
                    <div class="metric-value">2-3</div>
                    <div class="metric-label">Weeks</div>
                </div>
                <div class="metric-box">
                    <div class="metric-value">6/12</div>
                    <div class="metric-label">Components</div>
                </div>
            </div>
            
            <div class="footer">
                <div class="footer-left">
                    <span class="footer-label">Date</span>
                    <span>November 8, 2025</span>
                </div>
                <div class="footer-right">
                    <span class="footer-label">Prepared by</span>
                    <span>Manus AI Audit</span>
                </div>
            </div>
        </div>
        
        <div class="decorative-shape"></div>
    </div>
</body>
</html>
