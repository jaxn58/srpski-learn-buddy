<!doctype html>
<html lang="en">
  <head>
    <!-- Early WebAuthn Debug + Polyfill: must run BEFORE any auth widgets/scripts -->
    <script>
      (function () {
        // Capture the exact origin of the "CredentialsContainer get is read-only" error (PII-free).
        // This is temporary debug instrumentation and will be removed after verification.
        try {
          // Track dynamically added scripts that might be responsible (e.g. Clerk loading a webauthn helper).
          const mo = new MutationObserver((mutations) => {
            for (const m of mutations) {
              for (const n of Array.from(m.addedNodes || [])) {
                try {
                  if (!n || n.nodeType !== 1) continue;
                  const el = n;
                  if (el.tagName === "SCRIPT") {
                    const src = el.getAttribute("src") || "";
                    if (src && src.toLowerCase().includes("webauthn")) {
                      console.log("[WebAuthn Debug] Script inserted", { src });
                    }
                  }
                } catch (_) {}
              }
            }
          });
          mo.observe(document.documentElement, { childList: true, subtree: true });
        } catch (_) {}

        window.addEventListener(
          "error",
          function (event) {
            try {
              const msg = String(event && event.message ? event.message : "");
              const filename = event && event.filename ? String(event.filename) : "";
              const looksRelevant =
                (msg.includes("Cannot assign to read only property") && msg.includes("CredentialsContainer")) ||
                filename.toLowerCase().includes("webauthn");
              if (!looksRelevant) return;
              console.log("[WebAuthn Debug] Captured error", {
                message: msg,
                filename: filename || null,
                lineno: event && typeof event.lineno === "number" ? event.lineno : null,
                colno: event && typeof event.colno === "number" ? event.colno : null,
                stack:
                  event && event.error && event.error.stack
                    ? String(event.error.stack).split("\n").slice(0, 6).join("\n")
                    : null,
              });
            } catch (_) {}
          },
          true
        );

        // Fix read-only Credentials API in production (best-effort).
        if (typeof navigator !== "undefined" && navigator.credentials) {
          try {
            const originalGet = navigator.credentials.get;
            const originalCreate = navigator.credentials.create;
            const originalStore = navigator.credentials.store;
            const originalPreventSilentAccess = navigator.credentials.preventSilentAccess;

            const credentialsProxy = {
              get: function (...args) {
                return originalGet.apply(navigator.credentials, args);
              },
              create: function (...args) {
                return originalCreate.apply(navigator.credentials, args);
              },
              store: function (...args) {
                return originalStore ? originalStore.apply(navigator.credentials, args) : Promise.resolve();
              },
              preventSilentAccess: function (...args) {
                return originalPreventSilentAccess
                  ? originalPreventSilentAccess.apply(navigator.credentials, args)
                  : Promise.resolve();
              },
            };

            Object.defineProperty(navigator, "credentials", {
              value: credentialsProxy,
              writable: true,
              configurable: true,
              enumerable: true,
            });

            console.log("[WebAuthn Polyfill] Successfully patched Credentials API");
          } catch (e) {
            console.warn("[WebAuthn Polyfill] Could not patch Credentials API:", e);
          }
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Serbian AI Tutor</title>
    
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
